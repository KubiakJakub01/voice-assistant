services:
  # Backend Service
  - type: web
    name: voice-assistant-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: voice-assistant-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Service  
  - type: web
    name: voice-assistant-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: APP_BACKEND_URL
        fromService:
          type: web
          name: voice-assistant-backend
          property: host
      - key: NODE_ENV
        value: production
    autoDeploy: true

  # Database Service
  - type: pserv
    name: voice-assistant-db
    plan: free
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: POSTGRES_DB
        value: voice_assistant
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
